name: switchly
description: "Switchly - One-tap Quick Settings toggles Android doesn’t give you"
publish_to: 'none'
version: 0.0.1+1

environment:
  sdk: ^3.13.3

dependencies:
  equatable: ^3.0.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  image_picker: ^1.2.4
  material_symbols_icons: ^4.2960.0
  nepali_utils: ^3.0.8
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/logo/
    
  # Bundled so the app stays offline (no runtime font fetching). OFL licensed.
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800

# Regenerate with: dart run flutter_launcher_icons
# It rewrites EVERY android:icon in AndroidManifest.xml, including the tile services:
# restore their @drawable/ic_tile_* icons afterwards (git diff the manifest).
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/logo/logo_white.png
  min_sdk_android: 29
  # Adaptive + themed (Android 13 monochrome) icon from the same mark.
  adaptive_icon_background: "#100F13"
  adaptive_icon_foreground: assets/logo/logo_white_transparent.png
  adaptive_icon_monochrome: assets/logo/logo_white_transparent.png
  # The source images already have padding, so no extra inset.
  adaptive_icon_foreground_inset: 0
